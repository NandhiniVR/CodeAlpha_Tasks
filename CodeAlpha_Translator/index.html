<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>LinguaFlow — AI Translation</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>

  <header>
    <div class="logo">
      <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
        <circle cx="14" cy="14" r="13" stroke="#7fff6e" stroke-width="2"/>
        <path d="M14 4 Q20 14 14 24 Q8 14 14 4Z" fill="#7fff6e" opacity="0.3"/>
        <path d="M4 14 Q14 8 24 14 Q14 20 4 14Z" fill="#7fff6e" opacity="0.5"/>
      </svg>
      <span class="logo-text">LinguaFlow</span>
    </div>
    <div class="header-right">
      <button id="historyToggle" class="icon-btn" title="Translation History">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="6.5" stroke="currentColor" stroke-width="1.5"/><path d="M8 4.5V8.5L10.5 10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      </button>
      <button id="themeToggle" class="icon-btn" title="Toggle Theme">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="4" stroke="currentColor" stroke-width="1.5"/><path d="M8 1V2.5M8 13.5V15M1 8H2.5M13.5 8H15M3.05 3.05L4.11 4.11M11.89 11.89L12.95 12.95M3.05 12.95L4.11 11.89M11.89 4.11L12.95 3.05" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      </button>
    </div>
  </header>

  <main>
    <div class="hero">
      <div class="hero-tag">AI-POWERED · 100+ LANGUAGES</div>
      <h1 class="hero-title">Translate <em>anything</em>,<br>instantly.</h1>
    </div>

    <div class="translator-card">

      <!-- Language Selector Bar -->
      <div class="lang-bar">
        <div class="lang-select-wrapper">
          <label for="sourceLang">FROM</label>
          <select id="sourceLang"></select>
        </div>

        <button id="swapBtn" class="swap-btn" title="Swap languages">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M3 7h14M13 3l4 4-4 4M17 13H3M7 9l-4 4 4 4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>

        <div class="lang-select-wrapper">
          <label for="targetLang">TO</label>
          <select id="targetLang"></select>
        </div>
      </div>

      <!-- Text Panels -->
      <div class="panels">
        <!-- Left: Source -->
        <div class="panel left-panel">
          <textarea id="sourceText" placeholder="Type or paste text here…" spellcheck="true" maxlength="5000"></textarea>
          <div class="panel-footer">
            <span id="charCount">0 / 5000</span>
            <div class="panel-actions">
              <button class="tool-btn" id="clearBtn">✕ Clear</button>
              <button class="tool-btn" id="pasteBtn">⎘ Paste</button>
              <button class="tool-btn" id="speakSource">♪ Listen</button>
            </div>
          </div>
        </div>

        <!-- Center: Translate button -->
        <div class="center-divider">
          <button id="translateBtn" class="translate-btn">
            <svg width="22" height="22" viewBox="0 0 22 22" fill="none"><path d="M3 11h16M12 5l6 6-6 6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>

        <!-- Right: Translation output -->
        <div class="panel right-panel">
          <div id="translatedText" class="translated-output">
            <span class="placeholder">Translation will appear here…</span>
          </div>
          <div id="loadingBar" class="loading-bar"></div>
          <div class="panel-footer">
            <span id="detectedLang" class="detected-lang"></span>
            <div class="panel-actions">
              <button class="tool-btn" id="copyBtn">⎘ Copy</button>
              <button class="tool-btn" id="speakTarget">♪ Listen</button>
              <button class="tool-btn" id="downloadBtn">↓ Save</button>
            </div>
          </div>
        </div>
      </div>

      <!-- Mode & Options Row -->
      <div class="options-row">
        <div class="mode-group">
          <span class="options-label">Tone:</span>
          <button class="chip active" data-mode="standard">Standard</button>
          <button class="chip" data-mode="formal">Formal</button>
          <button class="chip" data-mode="casual">Casual</button>
        </div>
        <div class="mode-group">
          <button class="chip" id="autoDetectChip">🔍 Auto-Detect</button>
          <button class="chip" id="romanizeChip">Aa Romanize</button>
        </div>
      </div>
    </div>

    <!-- Quick Language Buttons -->
    <div class="quick-langs">
      <span class="quick-label">Quick:</span>
      <button class="quick-btn" data-lang="ta">🇮🇳 Tamil</button>
      <button class="quick-btn" data-lang="hi">🇮🇳 Hindi</button>
      <button class="quick-btn" data-lang="fr">🇫🇷 French</button>
      <button class="quick-btn" data-lang="es">🇪🇸 Spanish</button>
      <button class="quick-btn" data-lang="de">🇩🇪 German</button>
      <button class="quick-btn" data-lang="ja">🇯🇵 Japanese</button>
      <button class="quick-btn" data-lang="zh">🇨🇳 Chinese</button>
      <button class="quick-btn" data-lang="ar">🇸🇦 Arabic</button>
    </div>
  </main>

  <!-- History Sidebar -->
  <div id="historyPanel" class="history-panel">
    <div class="history-header">
      <span>History</span>
      <button id="clearHistory" class="icon-btn small" title="Clear history">🗑</button>
    </div>
    <ul id="historyList"></ul>
    <div id="historyEmpty" class="history-empty">No translations yet</div>
  </div>
  <div id="historyOverlay" class="history-overlay"></div>

  <!-- Toast -->
  <div id="toast" class="toast"></div>

  <script src="languages.js"></script>
  <script src="history.js"></script>
  <script src="speech.js"></script>
  <script src="translator.js"></script>
  <script src="app.js"></script>
</body>
</html>
